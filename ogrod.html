<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Projektant Ogrodu Leczniczego - Mobilny & JSON</title>
    <style>
        :root {
            --bg-color: #1a2318;
            --panel-bg: #243022;
            --accent-color: #5c9c42;
            --accent-hover: #72b05b;
            --text-color: #e8f0e6;
            --border-color: #384d35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #121910;
            padding: 10px 14px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.05rem;
            color: #92d075;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
        }

        button, .btn-label {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1 1 calc(50% - 6px);
            min-height: 42px;
        }

        button:active, .btn-label:active {
            transform: scale(0.98);
        }

        button.secondary, .btn-label.secondary {
            background-color: #3a4e37;
        }

        main {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .canvas-container {
            width: 100%;
            background-color: #0f140e;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; /* Blokuje przewijanie strony palcem podczas przeciągania na canvasie */
            user-select: none;
        }

        canvas {
            width: 100%;
            max-width: 1100px;
            height: auto;
            aspect-ratio: 11 / 8;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 8px;
            background-color: #72b05b;
            touch-action: none;
        }

        sidebar {
            width: 100%;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            background-color: #192218;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            color: #8fa88a;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #a6e38c;
            border-bottom: 3px solid #a6e38c;
            background-color: var(--panel-bg);
        }

        .tab-content {
            padding: 14px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        textarea {
            width: 100%;
            height: 320px;
            background-color: #141c13;
            color: #a3e687;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.78rem;
            line-height: 1.35;
            resize: vertical;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            margin-bottom: 4px;
            color: #b0c4ad;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #192218;
            color: white;
            font-size: 0.88rem;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background-color: #1a2519;
            border-radius: 6px;
            border: 1px solid #2e3d2c;
            font-size: 0.8rem;
        }

        .badge {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
            color: black;
            border: 1px solid #000;
            flex-shrink: 0;
        }

        .info-box {
            background-color: #192417;
            border: 1px solid #3d5438;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            line-height: 1.4;
            margin-bottom: 12px;
            color: #c2d6bf;
        }

        input[type="file"] {
            display: none;
        }

        /* Układ dla ekranów komputerów i tabletów poziomo */
        @media (min-width: 850px) {
            body {
                height: 100vh;
                overflow: hidden;
            }
            header {
                padding: 12px 20px;
            }
            header h1 {
                font-size: 1.2rem;
            }
            .toolbar {
                width: auto;
            }
            button, .btn-label {
                flex: none;
                padding: 8px 14px;
                min-height: auto;
            }
            main {
                flex-direction: row;
                overflow: hidden;
            }
            .canvas-container {
                flex: 1;
                padding: 20px;
                overflow: auto;
            }
            sidebar {
                width: 400px;
                border-top: none;
                border-left: 1px solid var(--border-color);
            }
            textarea {
                height: calc(100vh - 200px);
            }
            .legend-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌱 Projektant Ogrodu Leczniczego</h1>
        <div class="toolbar">
            <button class="secondary" onclick="resetToDefault()">🔄 Domyślny</button>
            <label class="btn-label secondary">
                📂 JSON <input type="file" id="importJsonFile" accept=".json" onchange="importJSONFile(event)">
            </label>
            <button class="secondary" onclick="exportJSON()">💾 Pobierz JSON</button>
            <button onclick="exportPNG()">📷 Pobierz PNG</button>
        </div>
    </header>

    <main>
        <div class="canvas-container">
            <canvas id="gardenCanvas" width="1100" height="800"></canvas>
        </div>

        <sidebar>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('legend')">📋 Legenda</div>
                <div class="tab" onclick="switchTab('add')">➕ Dodaj Roślinę</div>
                <div class="tab" onclick="switchTab('json')">⚙️ Kod JSON</div>
            </div>

            <!-- TAB 1: LEGENDA -->
            <div id="tab-legend" class="tab-content active">
                <div class="info-box">
                    📱 <b>Wskazówka mobilna:</b> Możesz przesuwać rośliny palcem bezpośrednio po ekranie mapy.
                </div>
                <div id="legendList" class="legend-grid"></div>
            </div>

            <!-- TAB 2: DODAJ ROŚLINĘ -->
            <div id="tab-add" class="tab-content">
                <div class="form-group">
                    <label>Numer ID rośliny:</label>
                    <input type="number" id="plantId" value="26">
                </div>
                <div class="form-group">
                    <label>Nazwa rośliny:</label>
                    <input type="text" id="plantName" placeholder="np. Szałwia lekarska">
                </div>
                <div class="form-group">
                    <label>Strefa ogrodu:</label>
                    <select id="plantZone">
                        <option value="Rabata 1">Rabata 1: Sucha i Słoneczna</option>
                        <option value="Rabata 2">Rabata 2: Umiarkowanie Wilgotna</option>
                        <option value="Rabata 3">Rabata 3: Wilgotna i Cienista</option>
                        <option value="Zagłębienie Kwasowe">Zagłębienie Kwasowe</option>
                        <option value="Dziki Zakątek">Dziki Zakątek</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Kolor znacznika:</label>
                    <input type="color" id="plantColor" value="#22c55e">
                </div>
                <div class="form-group">
                    <label>Współrzędna X (metry: 0 - 22):</label>
                    <input type="number" id="plantX" value="10" step="0.5">
                </div>
                <div class="form-group">
                    <label>Współrzędna Y (metry: 0 - 16):</label>
                    <input type="number" id="plantY" value="8" step="0.5">
                </div>
                <button style="width:100%; margin-top:10px;" onclick="addPlantFromForm()">➕ Dodaj do Ogrodu</button>
            </div>

            <!-- TAB 3: JSON EDITOR -->
            <div id="tab-json" class="tab-content">
                <div class="info-box">
                    Edytuj JSON i kliknij "Zastosuj Zmiany", aby zaktualizować projekt.
                </div>
                <textarea id="jsonTextArea"></textarea>
                <button style="width:100%; margin-top:10px;" onclick="applyJsonFromTextarea()">✅ Zastosuj Zmiany z JSON</button>
            </div>
        </sidebar>
    </main>

                { "id": 24, "name": "Malina właściwa", "zone": "Obwódka", "color": "#437328", "x": 15.0, "y": 0.6, "r": 0.40 },
                { "id": 24, "name": "Malina właściwa", "zone": "Obwódka", "color": "#437328", "x": 16.0, "y": 0.6, "r": 0.40 },
                { "id": 24, "name": "Malina właściwa", "zone": "Obwódka", "color": "#437328", "x": 17.0, "y": 0.6, "r": 0.40 },
                { "id": 24, "name": "Malina właściwa", "zone": "Obwódka", "color": "#437328", "x": 18.0, "y": 0.6, "r": 0.40 },
                { "id": 24, "name": "Malina właściwa", "zone": "Obwódka", "color": "#437328", "x": 19.0, "y": 0.6, "r": 0.40 },
                { "id": 24, "name": "Malina właściwa", "zone": "Obwódka", "color": "#437328", "x": 20.0, "y": 0.6, "r": 0.40 },
                { "id": 24, "name": "Malina właściwa", "zone": "Obwódka", "color": "#437328", "x": 21.0, "y": 0.6, "r": 0.40 },
                { "id": 25, "name": "Pokrzywa zwyczajna", "zone": "Dziki Zakątek", "color": "#3f6212", "x": 19.2, "y": 2.5, "r": 0.50 },
                { "id": 25, "name": "Pokrzywa zwyczajna", "zone": "Dziki Zakątek", "color": "#3f6212", "x": 20.5, "y": 3.8, "r": 0.50 }
            ],
            "decorations": [
                { "type": "bench", "name": "Ławka", "x": 12.5, "y": 9.1 },
                { "type": "water", "name": "Poidełko", "x": 6.8, "y": 11.8 }
            ]
        };

        let gardenData = JSON.parse(JSON.stringify(defaultGardenData));
        const canvas = document.getElementById('gardenCanvas');
        const ctx = canvas.getContext('2d');

        const margin = 50;
        let scaleX = (canvas.width - 2 * margin) / gardenData.dimensions.width;
        let scaleY = (canvas.height - 2 * margin) / gardenData.dimensions.height;

        let draggedItem = null;

        function toPx(x, y) {
            return {
                px: margin + x * scaleX,
                py: canvas.height - margin - y * scaleY
            };
        }

        function toMeters(px, py) {
            return {
                x: (px - margin) / scaleX,
                y: (canvas.height - margin - py) / scaleY
            };
        }

        // Pomocnicza funkcja do przeliczania punktów dotyku/myszy na piksele płótna (z uwzględnieniem skalowania CSS)
        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleFactorX = canvas.width / rect.width;
            const scaleFactorY = canvas.height / rect.height;

            return {
                x: (e.clientX - rect.left) * scaleFactorX,
                y: (e.clientY - rect.top) * scaleFactorY
            };
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Trawnik
            ctx.fillStyle = '#72b05b';
            ctx.fillRect(margin, margin, canvas.width - 2*margin, canvas.height - 2*margin);
            ctx.strokeStyle = '#2b401d';
            ctx.lineWidth = 2;
            ctx.strokeRect(margin, margin, canvas.width - 2*margin, canvas.height - 2*margin);

            // Poziomice
            drawContourLines();

            // Strefy
            gardenData.zones.forEach(zone => {
                if (zone.points.length < 3) return;
                ctx.beginPath();
                const start = toPx(zone.points[0][0], zone.points[0][1]);
                ctx.moveTo(start.px, start.py);
                for (let i = 1; i < zone.points.length; i++) {
                    const pt = toPx(zone.points[i][0], zone.points[i][1]);
                    ctx.lineTo(pt.px, pt.py);
                }
                ctx.closePath();
                ctx.fillStyle = zone.color;
                ctx.globalAlpha = 0.85;
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = zone.border;
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Ścieżki
            gardenData.paths.forEach(path => {
                if (path.points.length < 2) return;
                ctx.beginPath();
                const start = toPx(path.points[0][0], path.points[0][1]);
                ctx.moveTo(start.px, start.py);
                for (let i = 1; i < path.points.length; i++) {
                    const pt = toPx(path.points[i][0], path.points[i][1]);
                    ctx.lineTo(pt.px, pt.py);
                }
                ctx.strokeStyle = path.color;
                ctx.lineWidth = path.width * scaleX;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            });

            // Dekoracje
            gardenData.decorations.forEach(dec => {
                const pt = toPx(dec.x, dec.y);
                if (dec.type === 'bench') {
                    ctx.fillStyle = '#7a4b2a';
                    ctx.fillRect(pt.px - 20, pt.py - 8, 40, 16);
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.fillText('Ławka', pt.px - 15, pt.py + 3);
                } else if (dec.type === 'water') {
                    ctx.beginPath();
                    ctx.arc(pt.px, pt.py, 12, 0, Math.PI * 2);
                    ctx.fillStyle = '#4cc9f0';
                    ctx.fill();
                    ctx.strokeStyle = '#0077b6';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // Drzewa
            gardenData.trees.forEach(tree => {
                const pt = toPx(tree.x, tree.y);
                const rPx = tree.r * scaleX;

                ctx.beginPath();
                ctx.arc(pt.px + 8, pt.py + 8, rPx, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(pt.px, pt.py, rPx, 0, Math.PI * 2);
                ctx.fillStyle = tree.color;
                ctx.fill();
                ctx.strokeStyle = '#172e0a';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(pt.px, pt.py, 12, 0, Math.PI * 2);
                ctx.fillStyle = '#1e380e';
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(tree.id, pt.px, pt.py);
            });

            // Rośliny
            gardenData.plants.forEach(plant => {
                const pt = toPx(plant.x, plant.y);
                const rPx = (plant.r || 0.45) * scaleX;

                ctx.beginPath();
                ctx.arc(pt.px + 3, pt.py + 3, rPx, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(pt.px, pt.py, rPx, 0, Math.PI * 2);
                ctx.fillStyle = plant.color;
                ctx.fill();
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = isLightColor(plant.color) ? 'black' : 'white';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(plant.id, pt.px, pt.py);
            });

            drawCompassAndScale();
            document.getElementById('jsonTextArea').value = JSON.stringify(gardenData, null, 2);
        }

        function drawContourLines() {
            ctx.strokeStyle = '#385e2b';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.globalAlpha = 0.35;

            for (let r = 2; r <= 8; r += 2) {
                const mound = toPx(4.5, 4.5);
                ctx.beginPath();
                ctx.arc(mound.px, mound.py, r * scaleX, 0, Math.PI * 2);
                ctx.stroke();
            }

            for (let r = 1.5; r <= 5; r += 1.5) {
                const pit = toPx(17.5, 12.5);
                ctx.beginPath();
                ctx.arc(pit.px, pit.py, r * scaleX, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.setLineDash([]);
            ctx.globalAlpha = 1.0;
        }

        function drawCompassAndScale() {
            const cx = canvas.width - 80;
            const cy = 80;
            ctx.beginPath();
            ctx.arc(cx, cy, 22, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#8b0000';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('N', cx, cy - 8);
            ctx.fillStyle = '#d97706';
            ctx.fillText('S', cx, cy + 16);

            ctx.strokeStyle = 'black';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(margin, canvas.height - 20);
            ctx.lineTo(margin + 5 * scaleX, canvas.height - 20);
            ctx.stroke();

            ctx.fillStyle = 'black';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Skala: 5m', margin, canvas.height - 8);
        }

        function isLightColor(color) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            return ((r * 299 + g * 587 + b * 114) / 1000) > 155;
        }

        // UNIWERSALNA OBSŁUGA DOTYKU I MYSZY (POINTER EVENTS)
        canvas.addEventListener('pointerdown', (e) => {
            const coords = getCanvasCoordinates(e);

            for (let p of gardenData.plants) {
                const pt = toPx(p.x, p.y);
                const dist = Math.hypot(coords.x - pt.px, coords.y - pt.py);
                if (dist <= (p.r || 0.45) * scaleX + 10) { // powiększony margines kliknięcia dla palca
                    draggedItem = p;
                    canvas.setPointerCapture(e.pointerId);
                    return;
                }
            }

            for (let t of gardenData.trees) {
                const pt = toPx(t.x, t.y);
                const dist = Math.hypot(coords.x - pt.px, coords.y - pt.py);
                if (dist <= t.r * scaleX) {
                    draggedItem = t;
                    canvas.setPointerCapture(e.pointerId);
                    return;
                }
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!draggedItem) return;
            const coords = getCanvasCoordinates(e);
            const m = toMeters(coords.x, coords.y);
            draggedItem.x = Math.round(m.x * 10) / 10;
            draggedItem.y = Math.round(m.y * 10) / 10;
            render();
        });

        canvas.addEventListener('pointerup', (e) => {
            if (draggedItem) {
                draggedItem = null;
                try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
            }
        });

        function updateLegendUI() {
            const legendDiv = document.getElementById('legendList');
            legendDiv.innerHTML = '';

            const uniquePlants = [];
            const seenIds = new Set();

            gardenData.plants.forEach(p => {
                if (!seenIds.has(p.id)) {
                    seenIds.add(p.id);
                    uniquePlants.push(p);
                }
            });

            gardenData.trees.forEach(t => {
                if (!seenIds.has(t.id)) {
                    seenIds.add(t.id);
                    uniquePlants.push(t);
                }
            });

            uniquePlants.sort((a, b) => a.id - b.id);

            uniquePlants.forEach(p => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                const fontCol = isLightColor(p.color) ? 'black' : 'white';
                item.innerHTML = `
                    <div class="badge" style="background-color: ${p.color}; color: ${fontCol}">${p.id}</div>
                    <div style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        <b>${p.name}</b>
                        <div style="font-size:0.72rem; color:#8fa88a;">${p.zone || 'Krzew / Drzewo'}</div>
                    </div>
                `;
                legendDiv.appendChild(item);
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (tabName === 'legend') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('tab-legend').classList.add('active');
            } else if (tabName === 'add') {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('tab-add').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[2].classList.add('active');
                document.getElementById('tab-json').classList.add('active');
            }
        }

        function applyJsonFromTextarea() {
            try {
                const parsed = JSON.parse(document.getElementById('jsonTextArea').value);
                gardenData = parsed;
                render();
                updateLegendUI();
                alert('✅ Pomyślnie zaktualizowano ogród z kodu JSON!');
            } catch (err) {
                alert('❌ Błąd w strukturze JSON:\n' + err.message);
            }
        }

        function resetToDefault() {
            gardenData = JSON.parse(JSON.stringify(defaultGardenData));
            render();
            updateLegendUI();
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(gardenData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "ogrod_leczniczy.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSONFile(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    gardenData = JSON.parse(e.target.result);
                    render();
                    updateLegendUI();
                } catch (err) {
                    alert('Błąd podczas odczytu pliku JSON: ' + err.message);
                }
            };
            reader.readAsText(event.target.files[0]);
        }

        function exportPNG() {
            const link = document.createElement('a');
            link.download = 'ogrod_leczniczy_wizualizacja.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        function addPlantFromForm() {
            const id = parseInt(document.getElementById('plantId').value);
            const name = document.getElementById('plantName').value || 'Nowa Roślina';
            const zone = document.getElementById('plantZone').value;
            const color = document.getElementById('plantColor').value;
            const x = parseFloat(document.getElementById('plantX').value);
            const y = parseFloat(document.getElementById('plantY').value);

            gardenData.plants.push({
                id: id,
                name: name,
                zone: zone,
                color: color,
                x: x,
                y: y,
                r: 0.45
            });

            render();
            updateLegendUI();
            switchTab('legend');
        }

        render();
        updateLegendUI();
    </script>
</body>
</html>
